# Mantem poucos contextos do Spring abertos durante os testes: os antigos sao fechados ao sair de uso.
# Sem isso, ao fim da suite inteira, fechar todos os contextos de uma vez fazia o processo de teste
# estourar o tempo de encerramento (e o JaCoCo perdia os dados de cobertura).
spring.test.context.cache.maxSize=2
