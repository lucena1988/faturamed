<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Complete seu cadastro | FaturaMed</title><link rel="stylesheet" href="tokens.css?v=20261029-ui"><link rel="stylesheet" href="styles.css?v=20261029-ui"><link rel="stylesheet" href="identidade.css?v=20261103-tema"><link rel="stylesheet" href="tema.css?v=20261103-sino"><link rel="stylesheet" href="cadastro-medico.css?v=20261104-2"><script src="tema.js?v=20261009-1"></script></head>
<body><main class="cadastro-medico">
  <a class="company-name" href="completar-cadastro.html">FaturaMed</a> <button type="button" class="text-button" data-logout>Sair</button>
  <h1>Complete seu cadastro</h1>
  <p class="intro">Para continuar usando o portal, complete os dados do seu cadastro. Todos os campos são obrigatórios.</p>
  <form id="cadastro-form" data-modo="completar" novalidate>
    <fieldset disabled>
      <label class="largo">Nome completo<input name="nome" required maxlength="180" autocomplete="name"></label>
      <label>CRM<input name="crm" required maxlength="20" inputmode="numeric" pattern="[0-9]{1,20}"></label>
      <label>UF do CRM<select name="uf" required></select></label>
      <label>CPF<input name="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off"></label>
      <label class="largo">E-mails <small>(mais de um: separe com ; — o primeiro é o seu login)</small><input name="emails" required maxlength="500" autocomplete="email"></label>
      <h2>Empresa</h2>
      <label>Nome da empresa<input name="empresaNome" required maxlength="180" autocomplete="organization"></label>
      <label>CNPJ<input name="empresaCnpj" required inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00" autocomplete="off"></label>
      <button class="primary-button" type="submit">Salvar e continuar</button>
    </fieldset>
  </form>
  <p id="cadastro-message" role="status" aria-live="polite">Carregando...</p>
</main><script src="auth.js?v=20261108-hospital"></script><script src="cadastro-medico.js?v=20261104-1"></script></body></html>
