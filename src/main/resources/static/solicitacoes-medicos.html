<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solicitações dos médicos | FaturaMed</title><link rel="stylesheet" href="tokens.css?v=20261029-ui"><link rel="stylesheet" href="styles.css?v=20261029-ui"><link rel="stylesheet" href="identidade.css?v=20261029-barra"><link rel="stylesheet" href="painel-medico.css?v=20261029-ui"><link rel="stylesheet" href="login.css?v=20261029-ui"><link rel="stylesheet" href="tema.css?v=20261029-ui"><script src="tema.js?v=20261009-1"></script></head>
<body><main class="account-workspace">
  <header class="account-heading"><div><a class="company-name" href="/">FaturaMed</a><h1>Solicitações dos médicos</h1></div><a href="conciliacao.html">Conciliação de visitas</a></header>
  <form id="requests-filters" class="doctor-toolbar"><label class="select-field">Situação<select id="requests-status"><option value="ABERTAS">Abertas</option><option value="RESPONDIDAS">Respondidas</option><option value="TODAS">Todas</option></select></label><button class="text-button" type="submit">Atualizar fila</button></form>
  <p id="requests-message" role="status" aria-live="polite"></p><p id="requests-count"></p>
  <div class="doctor-table"><table><thead><tr><th>Pedido</th><th>Hospital / médico</th><th>Publicação / visita</th><th>Motivo</th><th>Resposta</th><th>Ação</th></tr></thead><tbody id="requests-rows"></tbody></table></div>
  <section class="doctor-section"><h2>Ciencia das publicacoes atuais</h2><p id="science-message" role="status"></p><div class="doctor-table"><table><thead><tr><th>Publicação / relatório</th><th>Hospital</th><th>Médico</th><th>Ciencia</th></tr></thead><tbody id="science-rows"></tbody></table></div></section>
  <dialog id="answer-dialog" aria-labelledby="answer-title"><form id="answer-form"><h2 id="answer-title">Responder solicitacao</h2><p id="answer-summary"></p><p id="answer-reason"></p><label class="select-field">Resposta ao médico<textarea name="resposta" rows="4" required minlength="5" maxlength="2000"></textarea></label><p id="answer-message" role="status"></p><button class="primary-button" id="answer-save" type="submit">Enviar resposta</button><button class="text-button" id="answer-close" type="button">Cancelar</button></form></dialog>
</main><script src="sidebar.js?v=20261030-ambiente"></script><script src="menu.js?v=20261029-3"></script><script src="auth.js?v=20261027-avisos"></script><script src="solicitacoes-medicos.js?v=20261015-1"></script></body></html>
