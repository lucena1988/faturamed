<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar | FaturaMed</title><link rel="stylesheet" href="tokens.css?v=20261029-ui"><link rel="stylesheet" href="styles.css?v=20261029-ui"><link rel="stylesheet" href="identidade.css?v=20261103-tema"><link rel="stylesheet" href="login.css?v=20261112-portal4"><link rel="stylesheet" href="tema.css?v=20261103-sino"><script src="tema.js?v=20261009-1"></script></head>
<body class="access-page login-page login-v2">
  <!-- fundo: azul-petroleo da marca com ondas verdes em movimento lento -->
  <div class="login-fundo" aria-hidden="true">
    <svg class="login-ondas" viewBox="0 0 1440 400" preserveAspectRatio="none">
      <path class="onda onda-1" d="M0,240 C240,180 360,300 720,240 C1080,180 1200,300 1440,240 L1440,400 L0,400 Z"/>
      <path class="onda onda-2" d="M0,290 C200,250 420,340 720,290 C1020,240 1240,330 1440,290 L1440,400 L0,400 Z"/>
      <path class="onda onda-3" d="M0,330 C260,300 460,370 720,335 C980,300 1180,365 1440,330 L1440,400 L0,400 Z"/>
    </svg>
    <div class="login-feed-fundo"></div>
    <span class="login-brilho login-brilho-1"></span><span class="login-brilho login-brilho-2"></span>
    <span class="login-vinheta"></span>
  </div>

  <main class="login-centro">
    <section class="access-form login-cartao" aria-labelledby="login-titulo">
      <img class="login-cartao-logo" src="assets/faturamed-logo.jpeg" alt="FaturaMed - Prestação de serviços" width="500" height="500">
      <h1 id="login-titulo">Entrar</h1>
      <p class="login-subtitle" id="login-subtitulo">Acesse o painel de faturamento</p>

      <fieldset class="login-portais">
        <legend>Eu sou</legend>
        <label class="login-portal"><input type="radio" name="portal" value="EQUIPE" checked><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg>Equipe</span></label>
        <label class="login-portal"><input type="radio" name="portal" value="MEDICO"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v5a4 4 0 0 0 8 0V3"/><path d="M10 12v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/></svg>Médico</span></label>
        <label class="login-portal"><input type="radio" name="portal" value="EMPRESA"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>Empresa</span></label>
        <label class="login-portal"><input type="radio" name="portal" value="HOSPITAL"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 7v6M9 10h6M9 21v-4h6v4"/></svg>Hospital</span></label>
      </fieldset>

      <form id="login-form" class="stack-form">
        <label>E-mail<input name="username" type="email" required maxlength="180" autocomplete="username" placeholder="nome@faturamed.com.br" id="login-email"></label>
        <label>Senha<span class="login-senha"><input name="password" type="password" required maxlength="72" autocomplete="current-password" id="login-senha"><button type="button" class="login-ver-senha" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
        <button class="primary-button" type="submit">Entrar</button>
      </form>
      <p class="login-esqueci"><a href="esqueci-senha.html">Esqueci minha senha</a></p>
      <p id="login-message" role="status" aria-live="polite"></p>
      <p class="login-health" id="login-health" data-state="checking"><span class="status-dot"></span><span>Verificando o sistema...</span></p>
    </section>
    <p class="login-rodape">Visitas, consultas, exames e procedimentos conciliados · LGPD</p>
  </main><script src="auth.js?v=20261110-semfab"></script><script src="login.js?v=20261112-portal3"></script>

</body></html>
