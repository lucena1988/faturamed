<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acessos | FaturaMed</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="identidade.css?v=20261009-1"><link rel="stylesheet" href="login.css?v=20261009-1"></head>
<body><main class="account-workspace">
  <header class="account-heading"><div><a class="company-name" href="/">FaturaMed</a><h1>Acessos</h1></div><div class="session-actions"><a href="/">Dashboard</a><a href="conta.html">Minha conta</a><button type="button" class="text-button" data-logout>Sair</button></div></header>
  <form id="access-form" class="stack-form account-form"><h2>Novo acesso</h2><label>Nome<input name="nome" required maxlength="180" autocomplete="name"></label><label>Email<input name="email" type="email" required maxlength="180" autocomplete="off"></label><label>Perfil<select name="perfil"><option value="MEDICO">Medico</option><option value="ADMIN">Administrador</option></select></label><label id="access-doctor-label">Medico cadastrado<select name="medicoId" required disabled></select></label><label>Senha inicial<input name="senha" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label><button class="primary-button" type="submit">Criar acesso</button></form>
  <p id="access-message" role="status" aria-live="polite"></p>
  <h2>Acessos cadastrados</h2><div class="account-table"><table><thead><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Medico</th><th>Situacao</th><th>Acoes</th></tr></thead><tbody id="access-rows"></tbody></table></div>
  <dialog id="password-dialog"><form id="reset-form" class="stack-form"><h2>Redefinir senha</h2><p id="reset-user"></p><label>Nova senha<input id="reset-password" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label><div class="session-actions"><button class="primary-button" type="submit">Salvar senha</button><button class="text-button" type="button" id="reset-cancel">Cancelar</button></div><p id="reset-message" role="status"></p></form></dialog>
</main><script src="auth.js?v=20261009-1"></script><script src="usuarios.js?v=20261009-1"></script></body></html>
