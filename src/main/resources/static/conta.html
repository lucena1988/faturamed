<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minha conta | FaturaMed</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="identidade.css?v=20261009-1"><link rel="stylesheet" href="login.css?v=20261009-1"></head>
<body><main class="account-workspace"><header class="account-heading"><div><span class="company-name">FaturaMed</span><h1>Minha conta</h1></div><div class="session-actions"><a id="account-back" href="login.html">Voltar ao painel</a><button class="text-button" type="button" data-logout>Sair</button></div></header><p id="account-name"></p><form id="account-password" class="stack-form account-form"><h2>Alterar senha</h2><label>Senha atual<input name="senhaAtual" type="password" required maxlength="72" autocomplete="current-password"></label><label>Nova senha<input name="novaSenha" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label><label>Confirmar nova senha<input name="confirmacao" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label><button type="submit" class="primary-button">Alterar senha</button></form><p id="account-message" role="status" aria-live="polite"></p></main><script src="auth.js?v=20261009-1"></script><script src="conta.js?v=20261009-1"></script></body></html>
