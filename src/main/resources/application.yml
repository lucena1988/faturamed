spring:
  application:
    name: faturamed
  http:
    converters:
      preferred-json-mapper: jackson2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/faturamed}
    username: ${DB_USER:faturamed}
    password: ${DB_PASSWORD:faturamed}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  # Envio de e-mail (recuperacao de senha). Sem MAIL_HOST o envio fica desligado.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 45MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

faturamed:
  # endereco usado nos links dos e-mails (ex.: https://faturamed.com.br)
  url-publica: ${APP_URL:http://localhost:8080}
  recuperacao-senha:
    remetente: ${MAIL_FROM:}
    # Somente para ambiente local sem SMTP: escreve o codigo no log. Nunca ligar em HML/producao.
    codigo-no-log: ${RECUPERACAO_CODIGO_NO_LOG:false}
