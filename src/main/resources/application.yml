spring:
  application:
    name: faturamed
  http:
    converters:
      preferred-json-mapper: jackson2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/faturamed}
    username: ${DB_USER:faturamed}
    password: ${DB_PASSWORD:faturamed}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 45MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
