name: Testes automatizados

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressao:
    name: Regressao completa
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-test.txt

      - name: Verificar Docker
        run: docker info

      - name: Executar suite completa
        run: python test.py

      - name: Publicar dashboard e evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regressao-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/
            !outputs/**/privado/**
            !outputs/**/*.dump
          retention-days: 14
          if-no-files-found: warn

      - name: Orientar consulta dos resultados
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Regressao completa
          Consulte o resultado da etapa **Executar suite completa** acima.
          Baixe o artefato `regressao-*`, extraia o ZIP e abra
          `dashboard-regressao.html`. Preserve as subpastas para os links funcionarem.
          Se a execucao falhar antes de gerar o dashboard, consulte os logs disponiveis.
          Backups privados nao sao publicados. Retencao: 14 dias.
          EOF
