services:
  postgres:
    image: postgres:16
    container_name: faturamed-postgres
    environment:
      POSTGRES_DB: faturamed
      POSTGRES_USER: faturamed
      POSTGRES_PASSWORD: faturamed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
