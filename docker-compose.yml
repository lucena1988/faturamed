services:
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/faturamed
      DB_USER: faturamed
      DB_PASSWORD: faturamed
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    container_name: faturamed-postgres
    environment:
      POSTGRES_DB: faturamed
      POSTGRES_USER: faturamed
      POSTGRES_PASSWORD: faturamed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faturamed -d faturamed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
